spring:
  datasource:
    hikari:
      maximum-pool-size: 5        # Render free tier is limited, don't over-pool
      minimum-idle: 2
      idle-timeout: 10000
      connection-timeout: 3000
      max-lifetime: 600000

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false


  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email,profile,openid
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email
            redirect-uri: ${APP_BASE_URL}/login/oauth2/code/github  # ← env var!

server:
  port: ${PORT:8080}   # Render injects PORT automatically

security:
  jwt:
    secret-key: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}
    access-token-cookie-name: ${JWT_ACCESS_TOKEN_COOKIE_NAME:access-token}
    refresh-token-cookie-name: ${JWT_REFRESH_TOKEN_COOKIE_NAME:refresh-token}
    cookie-secure: true        # ← MUST be true in prod (Render uses HTTPS)
    cookie-http-only: true
    cookie-path: /
    cookie-domain: ${JWT_COOKIE_DOMAIN:}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}
    cookie-max-age: ${JWT_COOKIE_MAX_AGE:3600}

app:
  cors:
    front-end:
      url: ${FRONTEND_URL}    # no default in prod — must be explicitly set

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY}

logging:
  level:
    org.hibernate.SQL: WARN   # no SQL spam in prod logs
    root: INFO